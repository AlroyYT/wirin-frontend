<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
    <title>Car Dashboard</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="left-section">
                <div class="time-date-weather">
                    <div class="time-date">
                        <p id="time">12:45 PM</p>
                        <p id="date">Sunday, 5 May</p>
                    </div>
                    <div class="weather">
                        <p id="weather-icon"><img src="images/Vector (6).svg" alt=""></p>
                        <p id="temperature">23°C / 27°C</p>
                    </div>
                </div>
            </div>
            <div class="right-section">
                <div class="connectivity-icons">
                    <div class="icon" style="background-image: url('images/Vector (4).svg');"></div>
                    <div class="icon" style="background-image: url('images/Vector (5).svg');"></div>
                    <div class="icon" style="background-image: url('images/Union (3).svg');"></div>
                </div>
                <div class="battery-info-bar">
                    <div class="battery-info">
                        <div class="remaining">
                            <span class="remaining-km" id="distance">204</span><span class="unit">km</span>
                            <div class="remaining-text">Remaining</div>
                        </div>
                        <div class="battery">
                            <span class="battery-percentage" id="battery">85</span><span class="unit">%</span>
                            <div class="battery-text">Battery</div>
                        </div>
                        <div class="average">
                            <span class="avg-wh" id="average">128</span><span class="unit">Wh/km</span>
                            <div class="average-text">Average</div>
                        </div>
                    </div>
                    <div class="battery-bar-container">
                        <div class="battery-bar-base">
                            <div class="battery-bar-fill" id="battery-bar-fill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main-content">
            <img src="images/Frame 4564.svg" alt="Frame" class="frame-image">
            <img src="images/map.svg" alt="Map" class="map-image">
        </main>
        <footer class="footer">
            <div class="toolbar">
                <button class="icon-button" style="background-image: url('images/Group 4548.svg');" onclick="openNewPage('https://example.com/page1')"></button>
                <button class="icon-button" style="background-image: url('images/Vector (3).svg');" onclick="openNewPage('https://example.com/page2')"></button>
                <button class="icon-button" style="background-image: url('images/Group 427318962.svg');" onclick="openNewPage('https://example.com/page6')"></button>
                <button class="icon-button" style="background-image: url('images/tesla.svg');" onclick="openNewPage('https://example.com/page4')"></button>
                <button class="icon-button" style="background-image: url('images/Vector (1).svg');" onclick="openNewPage('https://example.com/page5')"></button>
                <button class="icon-button" style="background-image: url('images/Vector (2).svg');" onclick="openNewPage('https://example.com/page6')"></button>
                <button class="icon-button" style="background-image: url('images/Group 427318961.svg');" onclick="openNewPage('https://example.com/page3')"></button>
            </div>
        </footer>
    </div>
    <script>
        // Function to update battery percentage (simulated)
        function updateBatteryPercentage() {
            // Simulated battery value (you should replace this with real data)
            var batteryValue = Math.floor(Math.random() * (100 - 70 + 1)) + 70; // Random number between 70 and 100

            // Update the battery percentage display
            document.getElementById('battery').textContent = batteryValue;
        }

        // Function to update current date and time
        function updateDateTime() {
            var now = new Date();

            // Update time
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // Handle midnight
            var timeString = hours + ':' + (minutes < 10 ? '0' + minutes : minutes) + ' ' + ampm;
            document.getElementById('time').textContent = timeString;

            // Update date
            var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            var dayOfWeek = days[now.getDay()];
            var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            var month = months[now.getMonth()];
            var date = now.getDate();
            var dateString = dayOfWeek + ', ' + date + ' ' + month;
            document.getElementById('date').textContent = dateString;
        }

        // Initial call to update time and battery percentage
        updateDateTime();
        updateBatteryPercentage();

        // Update time and battery percentage every minute (adjust as needed)
        setInterval(function() {
            updateDateTime();
            updateBatteryPercentage();
        }, 60000); // 60000 milliseconds = 1 minute

        // Function to open new page
        function openNewPage(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
